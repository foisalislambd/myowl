name: Bug report
description: Something in myOwl does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! **Security issues: do not open a public issue** — see SECURITY.md.
        Please remove IP addresses, hostnames and tokens from logs before pasting.
  - type: input
    id: version
    attributes:
      label: myOwl version
      description: Output of `myowl version` (or the version shown in the dashboard footer)
      placeholder: "1.0.0"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Install method
      options: [install.sh / systemd, Docker / Compose, Built from source]
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS and architecture
      placeholder: Ubuntu 24.04, amd64
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what happened instead?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: "`journalctl -u myowl -n 100` or `docker logs myowl`"
      render: text
