name: Release

# Every push to main reads `version:` from VERSION.md and compares it (semver)
# with the highest existing vX.Y.Z tag. A release is made ONLY when the version
# is strictly greater, or when no version tags exist yet. Otherwise the run logs
# a notice and finishes successfully without publishing anything.
#
# A release = GitHub Release + tag vX.Y.Z (notes = that version's changelog
# section in VERSION.md) with linux amd64/arm64 archives + SHA256SUMS, and a
# multi-arch image ghcr.io/<owner>/myowl:X.Y.Z and :latest.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    name: Decide
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.decide.outputs.release }}
      version: ${{ steps.decide.outputs.version }}
      tag: ${{ steps.decide.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - name: Compare VERSION.md with the latest tag
        id: decide
        run: |
          set -euo pipefail
          version="$(scripts/version.sh get)"
          tags="$(git ls-remote --tags --refs origin | sed 's#.*refs/tags/##')"
          latest="$(printf '%s\n' "$tags" | scripts/version.sh latest || true)"
          release="$(printf '%s\n' "$tags" | scripts/version.sh should-release "$version")"
          {
            echo "version=$version"
            echo "tag=v$version"
            echo "release=$release"
          } >> "$GITHUB_OUTPUT"
          if [ "$release" = "true" ]; then
            scripts/version.sh notes "$version" > /dev/null
            echo "::notice title=Release::Releasing v$version (latest tag: ${latest:-none})"
          else
            echo "::notice title=Release skipped::VERSION.md is $version, latest tag is v$latest. Bump the version in VERSION.md (it must be greater than v$latest) to publish a release."
          fi

  binaries:
    name: Build binaries
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: actions/setup-go@v7
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - name: Test
        run: make test-go
      - name: Build UI + linux/amd64 + linux/arm64 and package
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: make release VERSION="${{ needs.check.outputs.version }}"
      - name: Verify embedded version
        run: |
          out="$(./bin/myowl-linux-amd64 version)"
          echo "$out"
          case "$out" in *"${{ needs.check.outputs.version }}"*) ;; *) echo "::error::version not embedded"; exit 1 ;; esac
      - uses: actions/upload-artifact@v7
        with:
          name: release-files
          path: release/
          if-no-files-found: error
          retention-days: 7

  image:
    name: Docker image (GHCR, multi-arch)
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Image name (owner must be lowercase)
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/myowl" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ needs.check.outputs.version }}
            REVISION=${{ github.sha }}
            SOURCE=${{ github.server_url }}/${{ github.repository }}
          tags: |
            ${{ steps.img.outputs.name }}:${{ needs.check.outputs.version }}
            ${{ steps.img.outputs.name }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.check.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    name: Tag + GitHub Release
    needs: [check, binaries, image]
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: release-files
          path: release
      - name: Release notes from VERSION.md
        run: |
          {
            scripts/version.sh notes "${{ needs.check.outputs.version }}"
            echo
            echo "### Install"
            echo
            echo '```bash'
            echo "curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/${{ needs.check.outputs.tag }}/install.sh | sudo bash"
            echo "# or"
            echo "docker pull ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/myowl:${{ needs.check.outputs.version }}"
            echo '```'
            echo
            echo "Verify downloads with \`sha256sum -c SHA256SUMS --ignore-missing\`."
          } > notes.md
          cat notes.md
      - name: Create tag and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "::notice::Tag $TAG already exists (another run won the race); nothing to do."
            exit 0
          fi
          gh release create "$TAG" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "myOwl $TAG" \
            --notes-file notes.md \
            --latest
